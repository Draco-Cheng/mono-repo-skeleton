name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual CD run'

permissions:
  contents: write
  actions: read

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: Check if there are affected projects
  check:
    runs-on: ubuntu-latest
    outputs:
      has-affected: ${{ steps.check-affected.outputs.has-affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Set up base and head refs for nx affected
      - name: Set base and head SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      # Infrastructure lives OUTSIDE the nx project graph, so `nx affected`
      # cannot see it: helm/ (the shared ingress/cluster-issuer chart) belongs
      # to no project, and .github/scripts/ is what applies it. A commit
      # touching only those returns an empty affected list and the deploy is
      # skipped -- a green check that deploys nothing (confirmed on
      # yi-ying-orchids, derived from this template; see PR #231 there).
      #
      # Checked separately with git rather than by inventing an nx project for
      # helm/: those paths have no build, test or lint target, and a synthetic
      # project would have to be excluded from every run-many in the repo.
      - name: Check for infrastructure changes
        id: check-infra
        run: |
          CHANGED=$(git diff --name-only ${{ env.NX_BASE }} ${{ env.NX_HEAD }} -- helm/ .github/scripts/ || true)
          if [ -n "$CHANGED" ]; then
            echo "has-infra=true" >> $GITHUB_OUTPUT
            echo "Infrastructure changes found:"
            echo "$CHANGED"
          else
            echo "has-infra=false" >> $GITHUB_OUTPUT
            echo "No infrastructure changes"
          fi

      - name: Check if there are affected projects
        id: check-affected
        run: |
          AFFECTED=$(npx nx show projects --affected --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }})
          if [ -n "$AFFECTED" ]; then
            echo "Affected projects found: $AFFECTED"
          else
            echo "No affected projects"
          fi
          # Deploy when EITHER is true. An infra-only change still needs the
          # deploy job, which is what runs deploy-infra.sh; the publish job
          # below no-ops on its own when nx finds nothing to build.
          if [ -n "$AFFECTED" ] || [ "${{ steps.check-infra.outputs.has-infra }}" = "true" ]; then
            echo "has-affected=true" >> $GITHUB_OUTPUT
          else
            echo "has-affected=false" >> $GITHUB_OUTPUT
            echo "Nothing to deploy, skipping"
          fi

  # Job 2: Version — calculate and tag version (idempotent)
  version:
    needs: check
    if: needs.check.outputs.has-affected == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      # Tag-only release: we never bump package.json (all projects are private:true and
      # are deployed as Docker images, never npm-published — the version lives entirely in
      # the git tag). So no release commit is pushed to main, and affected can use the
      # previous tag as base with no version-bump noise to skip.
      nx-base: ${{ steps.set-version.outputs.nx-base }}
      nx-head: ${{ steps.set-shas.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set base and head SHAs
        id: set-shas
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Compute version and create git tag (tag-only, idempotent)
        id: set-version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          list_tags() { git tag -l | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V; }

          # HEAD may already be tagged from a prior run of this same commit (e.g. version
          # succeeded but a later job like deploy failed). Reuse that tag instead of asking
          # nx to compute a new one, so re-runs stay idempotent.
          VERSION=$(list_tags | grep -Fx "$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)" || true)

          if [ -z "$VERSION" ]; then
            PREV_TAG=$(list_tags | tail -1)
            FIRST_RELEASE_FLAG=""
            if [ -z "$PREV_TAG" ]; then FIRST_RELEASE_FLAG="--first-release"; fi

            # Let nx compute the next version from conventional commits, but DON'T let it
            # write package.json — run with --dry-run and parse the version it would apply.
            # "new version X.Y.Z" is absent whenever nx finds nothing version-worthy (e.g.
            # this push only touched non-nx files); `|| true` on the whole pipeline stops
            # that legitimate empty result from tripping `set -e` on grep's no-match exit.
            NEXT=$(npx nx release version --dry-run $FIRST_RELEASE_FLAG 2>&1 \
              | { grep -oE "new version [0-9]+\.[0-9]+\.[0-9]+" || true; } \
              | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || true)

            if [ -n "$NEXT" ]; then
              VERSION="v$NEXT"
              echo "Computed next version: $VERSION (from conventional commits, no manifest bump)"
              # Tag-only: push just the tag. No commit goes back to main, so the next run's
              # affected stays clean. A lightweight tag here is enriched into an annotated tag
              # later by annotate-release-tag.sh (after affected projects are known).
              git tag "$VERSION"
              git push origin "$VERSION"
            elif [ -n "$PREV_TAG" ]; then
              echo "No version-worthy changes since $PREV_TAG; reusing it"
              VERSION="$PREV_TAG"
            else
              echo "Could not determine next version from nx release; aborting"
              exit 1
            fi
          else
            echo "HEAD already tagged $VERSION, reusing"
          fi

          # Affected base = the tag before VERSION. With tag-only releases nothing is
          # committed between tags, so prev-tag..HEAD is exactly the real change set.
          # No prior tag at all (first release) falls back to nx-set-shas's own base.
          NX_BASE=$(list_tags | grep -vx "$VERSION" | tail -1)
          if [ -z "$NX_BASE" ]; then
            NX_BASE="${{ steps.set-shas.outputs.base }}"
            echo "No previous tag; falling back to nx-set-shas base $NX_BASE"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "nx-base=$NX_BASE" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
          echo "Affected base (nx-base): $NX_BASE"

  # Job 3: Publish — build, push Docker images, retag, annotate release
  publish:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
    env:
      # === Docker settings ===
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      # === GitHub context ===
      REPO_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      NX_BASE: ${{ needs.version.outputs.nx-base }}
      NX_HEAD: ${{ needs.version.outputs.nx-head }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same cache the CI workflow keeps, and it is the SAME nx cache: the
      # `lint build` step below runs the identical cacheable targets CI already
      # ran on this commit, so on a normal main-branch merge these are cache
      # hits rather than a second full rebuild.
      #
      # Cache-miss is the safe direction -- a miss rebuilds, it does not deploy
      # something stale. Docker image builds in `publish` are not covered here;
      # they are not nx-cacheable and pull their own layer cache from the
      # registry.
      - name: Cache nx computation
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      # Python and UV setup for backend projects
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - uses: astral-sh/setup-uv@v3
        with:
          # backend:build is `uv sync --extra dev`, so this job pays for a full
          # environment rebuild without it. Keyed on the lockfile so a
          # dependency change invalidates rather than reusing stale packages.
          enable-cache: true
          cache-dependency-glob: "apps/backend/uv.lock"
          # The post-job `uv cache prune --ci` hangs and is killed at exactly
          # 5m00s on every run, logging "failed with exit code 2". Harmless --
          # it runs after the job's real work and does not fail the build --
          # but it adds 5 minutes of wall clock to every run and puts a red
          # error in an otherwise green log, which trains people to ignore
          # errors there.
          #
          # Pruning only shrinks what gets uploaded; the cache is correct
          # without it. Keyed on uv.lock, so a stale entry is invalidated by
          # the lockfile rather than by pruning.
          prune-cache: false

      - name: Identify affected projects
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "NX_BASE: ${{ env.NX_BASE }}"
          echo "NX_HEAD: ${{ env.NX_HEAD }}"
          echo "VERSION: ${{ env.VERSION }}"
          echo "Affected projects:"
          npx nx show projects --affected --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      - name: Build and lint affected projects
        run: npx nx affected -t lint build --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      - name: Login to Docker Hub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Publish affected projects
        run: |
          npx nx affected -t publish --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      - name: Get last version for retagging
        run: |
          # Get the previous successful version (could be from git tags or a registry)
          LAST_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
          echo "LAST_VERSION=$LAST_VERSION" >> $GITHUB_ENV
          echo "Last version for retagging: $LAST_VERSION"

      - name: Retag non-affected projects with unified version
        run: bash .github/scripts/retag-non-affected.sh

      - name: Add release notes to git tag
        run: bash .github/scripts/annotate-release-tag.sh

  # Job 4: Deploy — setup K8S and deploy to cluster
  deploy:
    needs: [version, publish]
    runs-on: ubuntu-latest
    env:
      # === Docker settings ===
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      # === Kubernetes ===
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'default' }}
      K8S_CA_DATA: ${{ secrets.K8S_CA_DATA }}
      K8S_SERVER: ${{ secrets.K8S_SERVER }}
      K8S_USER_TOKEN: ${{ secrets.K8S_USER_TOKEN }}
      K8S_CLIENT_CERT: ${{ secrets.K8S_CLIENT_CERT }}
      K8S_CLIENT_KEY: ${{ secrets.K8S_CLIENT_KEY }}
      # === Ingress ===
      INGRESS_HOST: ${{ secrets.INGRESS_HOST }}
      # === GitHub context ===
      REPO_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      NX_BASE: ${{ needs.version.outputs.nx-base }}
      NX_HEAD: ${{ needs.version.outputs.nx-head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Setup kubectl and Helm for deployment
      - name: Setup kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Setup Kubernetes environment
        run: bash .github/scripts/setup-k8s.sh

      # Deploy infrastructure components (namespace, ingress) using Helm
      - name: Deploy infrastructure components
        run: bash .github/scripts/deploy-infra.sh

      # Deploy affected projects to Kubernetes using Helm
      - name: Deploy affected projects to Kubernetes
        run: |
          npx nx affected -t deploy --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}
