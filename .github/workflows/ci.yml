name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Documentation-only changes. `nx affected` already resolves these to zero
    # projects, so the run lints, tests and builds nothing -- but it still
    # installs Node, restores caches and (for an E2E-affected PR) starts
    # Postgres/Playwright deps to reach that conclusion.
    #
    # `.github/**` is deliberately absent -- a workflow change is exactly when
    # CI should run, since nothing else validates it.
    paths-ignore:
      - 'docs/**'
      - '**/AI_README.md'
      - '**/README.md'
      - 'LICENSE'
      - '*.md'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual CI run'

permissions:
  actions: read
  contents: read

# Cancel previous runs when new commits are pushed to the same PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node.js setup & cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Cache the INSTALLED TREE, not just the downloaded tarballs.
      # setup-node's own `cache: npm` only stores the npm cache, so a hit still
      # leaves `npm ci` to write out every file -- a disk-bound pass that costs
      # real time with no change to the lockfile in between.
      #
      # RESTORE-ONLY here, and deliberately not the combined `actions/cache@v4`.
      # That action saves in its post step from whatever ref it ran on, so on a
      # PR it would write an entry under `refs/pull/N/merge` that no other PR
      # (and no other workflow) can read -- a 1-use orphan every time. CD is the
      # writer, since it runs on `main` where the entry is readable by everyone.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      # Skipped on a hit: `npm ci` DELETES node_modules before installing, so
      # running it anyway would throw away the very thing just restored.
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Set up base and head refs for nx affected
      - name: Set base and head SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Identify affected projects
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "NX_BASE: ${{ env.NX_BASE }}"
          echo "NX_HEAD: ${{ env.NX_HEAD }}"
          echo "Affected projects:"
          npx nx show projects --affected --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      # Restore nx's local computation cache between runs. Without this every
      # run recomputes all targets even when their inputs are unchanged --
      # e.g. a backend-only PR still paid for both Angular builds.
      #
      # `restore-keys` matters more than the exact key here: a run whose inputs
      # differ still starts from the most recent cache and only recomputes the
      # targets that actually changed, rather than from empty.
      # RESTORE-ONLY on a PR. The save is CD's job, keyed on the branch name
      # rather than the commit SHA: a per-commit key never hits (every push is
      # a new commit) yet always saves, minting a new multi-hundred-MB entry on
      # every push that only `restore-keys` would ever read -- enough of those
      # fill the repo's cache quota and evict entries that actually get used.
      - name: Restore nx computation cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            nx-${{ runner.os }}-main
            nx-${{ runner.os }}-

      # Python and UV setup for backend projects
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - uses: astral-sh/setup-uv@v3
        with:
          # `uv sync --extra dev` runs once per backend target (build, lint,
          # test), and without this each one rebuilds the environment from
          # scratch. Keyed on the lockfile so a dependency change invalidates
          # it rather than silently reusing stale packages.
          enable-cache: true
          cache-dependency-glob: "apps/backend/uv.lock"
          # The post-job `uv cache prune --ci` hangs and is killed at exactly
          # 5m00s on every run, logging "failed with exit code 2". Harmless --
          # it runs after the job's real work and does not fail the build --
          # but it adds 5 minutes of wall clock to every run and puts a red
          # error in an otherwise green log, which trains people to ignore
          # errors there.
          #
          # Pruning only shrinks what gets uploaded; the cache is correct
          # without it. Keyed on uv.lock, so a stale entry is invalidated by
          # the lockfile rather than by pruning.
          prune-cache: false

      # Run all checks for affected projects
      - name: Run CI checks for affected projects
        run: |
          npx nx affected -t lint test build typecheck --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      # Test Docker builds if Dockerfile or package.json changed
      - name: Test Docker builds
        run: |
          if git diff --name-only ${{ env.NX_BASE }} ${{ env.NX_HEAD }} | grep -qE '(Dockerfile|package\.json)'; then
            for project in $(npx nx show projects --affected --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}); do
              DOCKERFILE="apps/$project/Dockerfile"
              if git show ${{ env.NX_HEAD }}:"$DOCKERFILE" > /dev/null 2>&1; then
                git checkout ${{ env.NX_HEAD }} -- "$DOCKERFILE"
                docker build --target production -t "$project:ci-test" --file "$DOCKERFILE" "apps/$project"
              fi
            done
          fi

      # Check if E2E tests are affected
      - name: Check if E2E tests are affected
        id: check-e2e
        run: |
          E2E_PROJECTS=$(npx nx show projects --affected --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }} -t e2e)
          if [ -n "$E2E_PROJECTS" ]; then
            echo "E2E projects affected: $E2E_PROJECTS"
            echo "e2e-affected=true" >> $GITHUB_OUTPUT
          else
            echo "No E2E projects affected"
            echo "e2e-affected=false" >> $GITHUB_OUTPUT
          fi

      # Cache Playwright's downloaded browser binaries (~/.cache/ms-playwright)
      # across runs — keyed on OS + the exact @playwright/test version pinned
      # in package-lock.json, so a version bump naturally invalidates it
      # instead of silently reusing stale browsers. This does NOT cache the
      # apt-installed OS-level deps (--with-deps) — those install into the
      # runner's system dirs, not a path actions/cache can restore, but they
      # were never the slow part; the multi-hundred-MB browser downloads were.
      #
      # This key is IDENTICAL across branches, and GitHub scopes a cache to the
      # ref that wrote it. The combined `actions/cache@v4` action saves from
      # whatever ref it ran on, so every PR once saved its own ~500 MB copy of
      # the same browsers under the same key and could not read any of the
      # others -- many copies, zero cross-PR hits.
      #
      # A PR still writes this one (see the save below) because CD never
      # installs browsers. What stops the pile-up is the miss guard, not the
      # ref: a PR that hits saves nothing, and a PR-ref entry is readable by
      # later runs on that same PR.
      - name: Restore Playwright browsers
        if: steps.check-e2e.outputs.e2e-affected == 'true'
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install Playwright dependencies only if E2E tests are affected.
      # On a cache hit, skip re-downloading the browser binaries (--with-deps
      # alone still ensures the OS-level shared libs are present, which is
      # fast — apt with nothing new to fetch) — only a cache miss pays for
      # the full `install ... --with-deps` browser download.
      - name: Install Playwright dependencies
        if: steps.check-e2e.outputs.e2e-affected == 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium firefox webkit
          else
            npx playwright install chromium firefox webkit --with-deps
          fi

      # Run E2E tests for affected projects
      - name: Run E2E tests for affected projects
        if: steps.check-e2e.outputs.e2e-affected == 'true'
        run: |
          npx nx affected -t e2e --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }}

      # Save the cache only from here -- see the restore step above for why.
      # `always()` so a red run still contributes: the work was already paid
      # for, and a failing test says nothing about whether the browser
      # binaries are valid. The `cache-hit != 'true'` guard is what keeps a
      # PR safe to write: once any run has stored this key, every later run
      # hits and saves nothing, so the many-copies-of-the-same-browsers
      # problem cannot recur.
      - name: Save Playwright browsers
        if: >-
          always()
          && steps.check-e2e.outputs.e2e-affected == 'true'
          && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

