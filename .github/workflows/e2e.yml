name: Nightly E2E Tests

on:
  # Run E2E tests nightly (full suite)
  # schedule:
  #   - cron: '0 2 * * *'  # Every day at 2 AM UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual E2E test run'
        required: false
        default: 'Manual E2E test run'

permissions:
  actions: read
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node.js setup & cache
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Same installed-tree cache as ci.yml -- see that file for why the npm
      # cache alone is not enough and why there are no restore-keys.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-v2-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      # Skipped on a hit: `npm ci` DELETES node_modules before installing.
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Same nx cache as ci.yml and deploy.yml. `nx build backend frontend`
      # below is cacheable; the `e2e` target deliberately is not (it drives a
      # live browser against live services, so a replayed cache entry would
      # report a pass nothing actually ran).
      #
      # RESTORE-ONLY. A `${{ github.sha }}` key never hits yet always saves, so
      # each run minted another 300-400 MB entry; ci.yml on `main` is the sole
      # writer now. See ci.yml for the full account.
      - name: Restore nx computation cache
        uses: actions/cache/restore@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            nx-${{ runner.os }}-main
            nx-${{ runner.os }}-

      # Python setup for backend
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      # backend:build IS `uv sync --extra dev`, so uv has to exist here. It was
      # missing entirely -- latent because this workflow's schedule is
      # commented out, so it only runs when someone dispatches it by hand.
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "apps/backend/uv.lock"
          # The post-job `uv cache prune --ci` hangs and is killed at exactly
          # 5m00s on every run, logging "failed with exit code 2". Harmless --
          # it runs after the job's real work and does not fail the build --
          # but it adds 5 minutes of wall clock to every run and puts a red
          # error in an otherwise green log, which trains people to ignore
          # errors there.
          #
          # Pruning only shrinks what gets uploaded; the cache is correct
          # without it. Keyed on uv.lock, so a stale entry is invalidated by
          # the lockfile rather than by pruning.
          prune-cache: false

      # Same browser cache ci.yml writes from `main`, restored here rather
      # than re-downloading several hundred MB on every manual run. Nothing
      # is saved back: ci.yml owns this key.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Install main browsers (Chromium, Firefox, Webkit). On a hit only the
      # OS-level shared libs are installed -- fast, apt with nothing to fetch.
      - name: Install Playwright dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium firefox webkit
          else
            npx playwright install chromium firefox webkit --with-deps
          fi

      # Build dependencies and run all E2E tests
      - name: Build and run all E2E tests
        run: |
          # Build all services first
          npx nx build backend frontend

          # Run all E2E tests (services will be auto-started by Playwright)
          npx nx run-many -t e2e

      # Trigger deployment if E2E tests pass
      - name: Trigger deployment
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: e2e-passed