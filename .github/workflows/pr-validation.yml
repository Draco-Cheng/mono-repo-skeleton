name: PR Validation

on:
  pull_request:
    # No `synchronize`. This job reads ONLY the PR title, which a push cannot
    # change -- `opened` and `edited` are the two events that can. Every job
    # is billed as a whole minute however short it is, and this one finishes
    # in a few seconds, so re-running it on each push wastes a full minute
    # re-checking a string that had not moved.
    types: [opened, edited]

# Prevent duplicate runs for the same PR
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: false
          validateSingleCommit: false
          ignoreLabels: |
            ignore-semantic-pull-request