# `[pytest]`, NOT `[tool:pytest]`. The latter is setup.cfg's header; in a
# pytest.ini file pytest reports the file as its `configfile` but silently
# ignores a section it does not recognise -- so every setting below was
# previously inert without any error (confirmed on yi-ying-orchids, derived
# from this template: `-n auto` changed nothing until this was fixed).
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -n auto: parallelism is the main lever for a suite of many small tests.
# `auto` adapts to whatever machine runs it (many cores locally, fewer on CI
# runners) rather than pinning a worker count that suits neither.
#
# -v deliberately omitted: printing every test name helps nobody and just
# bloats CI logs. --tb=short still shows failures in full.
addopts = -n auto --tb=short
asyncio_mode = auto
